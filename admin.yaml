services:
  s3admin:
    image: dpage/pgadmin4:latest

    container_name: 68-s3-admin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_MAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
    - ${ADMIN_PORT}:80
  

networks:
  my-network:
    driver: bridge